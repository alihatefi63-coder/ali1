name: Daily Instagram Post

on:
  schedule:
    - cron: '30 16 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests woocommerce instagrapi Pillow
      - name: Run bot
        run: python bot.py
      - name: Save posted IDs
        run: |
          git config user.name "Bot"
          git config user.email "bot@github.com"
          git add posted_ids.txt ig_session.json
          git commit -m "Update posted list" || exit 0
          git push
